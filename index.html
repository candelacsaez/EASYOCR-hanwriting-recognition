<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dreamlogue — Handwriting Journal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Cormorant+SC:wght@300;400&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --ink: #1c1814;
      --ink-light: #433d3d;
      --ink-faint: #282626;
      --parchment: #cbc6c1;
      --parchment-warm: #d1cdcd;
      --parchment-deep: #dbc4c4;
      --cream: #fbfbfbcc;
      --rule: #131313;
      --rule-dark: #0b0a09;
      --accent: #110e06;
      --accent-light: #212020;
    }

    html {
      background-color: var(--parchment-warm);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--parchment-warm);
      background-image:
        radial-gradient(ellipse at 15% 20%, rgba(139, 105, 20, 0.05) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 80%, rgba(139, 105, 20, 0.04) 0%, transparent 50%);
      font-family: 'Cormorant Garamond', Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 80px;
    }

    /* Masthead */
    .masthead {
      width: 100%;
      max-width: 860px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 36px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--rule-dark);
    }

    .masthead-logo {
      font-family: 'Cormorant SC', serif;
      font-weight: 300;
      font-size: 13px;
      letter-spacing: 0.25em;
      color: var(--ink-faint);
      text-transform: uppercase;
    }

    .masthead-date {
      font-family: 'EB Garamond', serif;
      font-style: italic;
      font-size: 13px;
      color: var(--ink-faint);
      letter-spacing: 0.03em;
    }

    /* Journal Page */
    .journal-page {
      background: var(--cream);
      width: 100%;
      max-width: 860px;
      position: relative;
      /* Subtle paper texture via layered shadows and border */
      box-shadow:
        0 1px 0 #e0d8c4,
        0 2px 0 #d8ceb8,
        0 3px 0 #cfc4ac,
        0 6px 18px rgba(30, 24, 12, 0.07),
        0 16px 48px rgba(30, 24, 12, 0.05);
      border: 1px solid var(--rule);
      border-top: none;
    }

    /* Binding strip on left */
    .journal-page::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(to bottom,
        var(--accent-light) 0%,
        var(--accent) 30%,
        #6b4f0e 70%,
        var(--accent) 100%
      );
      opacity: 0.6;
    }

    /* Faint horizontal ruling behind canvas area */
    .ruling-container {
      position: relative;
      padding: 0 72px;
    }

    /* Page header area */
    .page-header {
      padding: 44px 72px 0;
      position: relative;
    }

    .page-header-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .page-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: 42px;
      color: var(--ink);
      letter-spacing: -0.01em;
      line-height: 1;
    }

    .page-number {
      font-family: 'Cormorant SC', serif;
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--ink-faint);
    }

    .header-rule {
      width: 100%;
      height: 1px;
      background: linear-gradient(to right, var(--accent), var(--rule));
      margin: 14px 0 0;
      opacity: 0.7;
    }

    /* Canvas wrapper */
    .canvas-wrapper {
      padding: 0 72px;
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      background: transparent;
      touch-action: none;
      position: relative;
      z-index: 1;
      cursor: crosshair;
    }

    /* Ruled line background for canvas */
    .ruled-bg {
      position: absolute;
      top: 0;
      left: 72px;
      right: 72px;
      bottom: 0;
      z-index: 0;
      pointer-events: none;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 37px,
        rgba(180, 168, 148, 0.22) 37px,
        rgba(180, 168, 148, 0.22) 38px
      );
      background-position: 0 24px;
    }

    /* Margin line */
    .ruled-bg::before {
      content: '';
      position: absolute;
      top: 0;
      left: 48px;
      bottom: 0;
      width: 1px;
      background: rgba(196, 154, 42, 0.2);
    }

    /* Action bar */
    .action-bar {
      padding: 22px 72px 32px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      border-top: 1px solid var(--parchment-deep);
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    button {
      font-family: 'Cormorant SC', serif;
      font-weight: 400;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
      border-radius: 0;
      padding: 9px 22px;
      line-height: 1;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--rule-dark);
      color: var(--ink-faint);
    }

    .btn-ghost:hover {
      background: var(--parchment-warm);
      border-color: var(--ink-faint);
      color: var(--ink-light);
    }

    .btn-primary {
      background: var(--ink);
      border: 1px solid var(--ink);
      color: var(--parchment);
    }

    .btn-primary:hover {
      background: var(--ink-light);
      border-color: var(--ink-light);
    }



    /* Output / transcription area */
    .transcription-section {
      margin: 0 72px;
      padding: 24px 0 40px;
      border-top: 1px solid var(--parchment-deep);
      display: none;
    }

    .transcription-section.visible {
      display: block;
    }

    .transcription-label {
      font-family: 'Cormorant SC', serif;
      font-weight: 300;
      font-size: 10px;
      letter-spacing: 0.25em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    #output {
      font-family: 'EB Garamond', serif;
      font-size: 19px;
      color: var(--ink-light);
      line-height: 1.75;
      min-height: 24px;
      font-style: italic;
    }

    #output.empty {
      color: var(--rule-dark);
      font-style: italic;
    }

    /* Loading state */
    .thinking {
      display: none;
      align-items: center;
      gap: 8px;
      font-family: 'Cormorant SC', serif;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--ink-faint);
    }

    .thinking.active {
      display: flex;
    }

    .dot-pulse {
      display: flex;
      gap: 4px;
    }

    .dot-pulse span {
      width: 3px;
      height: 3px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
    .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.2; transform: scale(1); }
      40% { opacity: 1; transform: scale(1.3); }
    }

    /* Footer flourish */
    .page-footer {
      padding: 0 72px 28px;
      display: flex;
      justify-content: center;
    }

    .flourish {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      color: var(--rule);
      letter-spacing: 0.3em;
      user-select: none;
    }

    /* Responsive */
    @media (max-width: 640px) {
      body { padding: 24px 12px 60px; }
      .masthead { max-width: 100%; margin-bottom: 20px; }
      .journal-page { max-width: 100%; }
      .page-header { padding: 32px 32px 0; }
      .page-title { font-size: 30px; }
      .canvas-wrapper { padding: 0 32px; }
      .action-bar { padding: 18px 32px 26px; }
      .transcription-section { margin: 0 32px; }
      .page-footer { padding: 0 32px 22px; }
    }
  </style>
</head>
<body>

  <!-- Masthead -->
  <header class="masthead">
    <div class="masthead-logo">Dreamlogue</div>
    <div class="masthead-date" id="today-date"></div>
  </header>

  <!-- Journal Page -->
  <div class="journal-page">

    <div class="page-header">
      <div class="page-header-top">
        <h1 class="page-title">Write your dream</h1>
        <span class="page-number">I.</span>
      </div>
      <div class="header-rule"></div>
    </div>

    <!-- Canvas -->
    <div class="canvas-wrapper">
      <div class="ruled-bg"></div>
      <canvas id="canvas" width="900" height="560"></canvas>
    </div>

    <!-- Action bar -->
    <div class="action-bar">
      <div class="btn-group">
        <button class="btn-ghost" onclick="clearCanvas()">Clear</button>
        <button class="btn-primary" onclick="recognize()">Transcribe</button>
      </div>
    </div>

    <!-- Transcription -->
    <div class="transcription-section" id="transcription-section">
      <div class="transcription-label">Transcription</div>
      <div class="thinking" id="thinking">
        <div class="dot-pulse">
          <span></span><span></span><span></span>
        </div>
        Reading your hand
      </div>
      <div id="output"></div>
    </div>

    

  </div>

  <script>
    // Date
    const dateEl = document.getElementById('today-date');
    const now = new Date();
    dateEl.textContent = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    // Canvas setup
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;
    let lastX = 0, lastY = 0;
    let penSize = 3;

    ctx.strokeStyle = '#1c1814';
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.lineWidth = penSize;

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    canvas.addEventListener('mousedown', (e) => {
      drawing = true;
      const pos = getPos(e);
      lastX = pos.x; lastY = pos.y;
      ctx.beginPath();
      ctx.arc(lastX, lastY, ctx.lineWidth / 2, 0, Math.PI * 2);
      ctx.fillStyle = '#1c1814';
      ctx.fill();
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!drawing) return;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(pos.x, pos.y);
      ctx.strokeStyle = '#1c1814';
      ctx.lineWidth = penSize;
      ctx.stroke();
      lastX = pos.x; lastY = pos.y;
    });

    canvas.addEventListener('mouseup', () => drawing = false);
    canvas.addEventListener('mouseleave', () => drawing = false);

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      drawing = true;
      const pos = getPos(e);
      lastX = pos.x; lastY = pos.y;
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (!drawing) return;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(pos.x, pos.y);
      ctx.strokeStyle = '#1c1814';
      ctx.lineWidth = penSize;
      ctx.stroke();
      lastX = pos.x; lastY = pos.y;
    }, { passive: false });

    canvas.addEventListener('touchend', () => drawing = false);

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const section = document.getElementById('transcription-section');
      section.classList.remove('visible');
      document.getElementById('output').textContent = '';
    }

    async function recognize() {
      const section = document.getElementById('transcription-section');
      const output = document.getElementById('output');
      const thinking = document.getElementById('thinking');

      section.classList.add('visible');
      thinking.classList.add('active');
      output.textContent = '';

      const image = canvas.toDataURL('image/png');

      try {
        const response = await fetch('http://127.0.0.1:8000/ocr', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image })
        });
        const data = await response.json();
        thinking.classList.remove('active');
        output.textContent = data.text || '(nothing detected)';
      } catch (err) {
        thinking.classList.remove('active');
        output.textContent = '(could not reach server — is your backend running?)';
        output.classList.add('empty');
      }
    }
  </script>

</body>
</html>
