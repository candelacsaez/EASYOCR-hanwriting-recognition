<!DOCTYPE html>
<html>
<head>
  <title>Handwriting Journal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      background-color: #f4f1ea;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .page {
      background: #fffdf8;
      width: 950px;
      max-width: 100%;
      padding: 50px 60px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      border-radius: 6px;
      border: 1px solid #e6e2d8;
    }

    h2 {
      text-align: center;
      font-weight: normal;
      font-size: 28px;
      margin-bottom: 40px;
      color: #3a3a3a;
    }

    canvas {
      display: block;
      margin: 0 auto;
      border: none;
      border-bottom: 2px solid #d8d3c8;
      background-color: #fffdf8;
      touch-action: none;
      width: 100%;
      max-width: 900px;
      height: auto;
    }

    .buttons {
      text-align: center;
      margin-top: 30px;
    }

    button {
      background: none;
      border: 1px solid #bdb7a8;
      padding: 8px 20px;
      margin: 0 10px;
      font-family: inherit;
      font-size: 14px;
      color: #4a4a4a;
      cursor: pointer;
      transition: all 0.2s ease;
      border-radius: 3px;
    }

    button:hover {
      background-color: #f1ede4;
    }

    #output {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #e0dbcf;
      font-size: 16px;
      color: #444;
      min-height: 30px;
      line-height: 1.6;
    }

    @media (max-width: 768px) {
      .page {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="page">
    <h2>Write your dream</h2>

    <canvas id="canvas" width="900" height="600"></canvas>

    <div class="buttons">
      <button onclick="clearCanvas()">Clear</button>
      <button onclick="recognize()">Recognize</button>
    </div>

    <div id="output"></div>
  </div>



<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// ✅ Fond blanc initial
ctx.fillStyle = "white";
ctx.fillRect(0, 0, canvas.width, canvas.height);

// ✅ Paramètres du stylet
ctx.lineWidth = 6;      // épaisseur du trait
ctx.strokeStyle = "black";
ctx.lineCap = "round";

let drawing = false;

// ✅ Gestion du dessin avec la souris
canvas.addEventListener("mousedown", e => {
  drawing = true;
  ctx.beginPath();
  ctx.moveTo(e.offsetX, e.offsetY);
});

canvas.addEventListener("mousemove", e => {
  if (!drawing) return;
  ctx.lineTo(e.offsetX, e.offsetY);
  ctx.stroke();
});

canvas.addEventListener("mouseup", () => drawing = false);
canvas.addEventListener("mouseleave", () => drawing = false);

// ✅ Fonction pour effacer le canvas
function clearCanvas() {
  ctx.fillStyle = "white";          // on remet le fond blanc
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  document.getElementById("output").innerText = "";
}

// ✅ Fonction pour envoyer l'image et récupérer le texte
async function recognize() {
  const image = canvas.toDataURL("image/png");

  // 🔹 debug: vérifier que le canvas est capturé
  console.log("Base64 image:", image.slice(0, 100));
  console.log("Canvas size:", canvas.width, canvas.height);

  const response = await fetch("https://candelacsaez.github.io/EASYOCR-hanwriting-recognition/", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ image })
  });

  const data = await response.json();
  document.getElementById("output").innerText =
    "Recognized text: " + (data.text || "(rien détecté)");
}




</script>

</body>
</html>
